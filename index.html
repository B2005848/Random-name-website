<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đập Muỗi – Gọi tên học sinh</title>
<!-- Tải thư viện đọc Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#ffe27a;color:#3b2a20}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button,select{font:inherit;cursor:pointer}
#hud{position:fixed;top:12px;left:12px;background:#fffbe8;border:3px solid #7a4b1e;border-radius:14px;padding:10px 14px;min-width:210px;box-shadow:0 4px 0 #7a4b1e;line-height:1.55}
#hud .c{font-size:20px;font-weight:800}
#win{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;background:linear-gradient(#ff8a1f,#e8333f);border:6px solid #fff;border-radius:28px;padding:16px 44px 20px;color:#fff;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25);cursor:pointer;max-width:94vw;z-index:5}
#win small{font-size:clamp(18px,2.4vw,28px);font-weight:700}
#win b{font-size:clamp(38px,8vw,110px);line-height:1.1;text-shadow:0 5px 0 rgba(0,0,0,.3);word-break:break-word}
#win.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}100%{transform:translate(-50%,-50%) scale(1)}}
#msg{position:fixed;top:16%;left:50%;transform:translateX(-50%);background:#fff;border:3px solid #7a4b1e;border-radius:14px;padding:10px 18px;font-weight:700;display:none;z-index:6;max-width:92vw;text-align:center}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;padding:10px 14px;background:rgba(255,251,232,.96);border-top:4px solid #7a4b1e}
#bar button,#bar select{border:3px solid #7a4b1e;border-radius:12px;background:#fff;padding:7px 12px;font-weight:700;color:#3b2a20}
#bar button:hover{background:#fff1c2}
#bar .big{background:linear-gradient(#ff9a2e,#e8533f);color:#fff;font-size:22px;padding:10px 24px;box-shadow:0 4px 0 #7a4b1e}
#bar .big:hover{background:linear-gradient(#ffad4d,#f0654f)}
#bar .big:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4b1e}
.grp{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.seg{display:inline-flex}
.seg button{border-radius:0!important;padding:5px 10px!important;font-size:13px;margin-left:-3px}
.seg button:first-child{border-radius:10px 0 0 10px!important;margin-left:0}
.seg button:last-child{border-radius:0 10px 10px 0!important}
.seg button.on{background:#7a4b1e!important;color:#fff!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
.card{background:#fffbe8;border:4px solid #7a4b1e;border-radius:18px;padding:18px;width:min(580px,94vw);max-height:92vh;overflow:auto}
.card h2{margin:0 0 12px}
.card .row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.card label{font-weight:700;display:block;margin:8px 0 4px}
.card input[type=text],.card textarea,.card select{width:100%;border:2px solid #7a4b1e;border-radius:10px;padding:8px 10px;font:inherit;background:#fff}
.card .row select{flex:1;width:auto}
.card textarea{min-height:200px;resize:vertical}
.card button{border:3px solid #7a4b1e;border-radius:12px;background:#fff;padding:7px 14px;font-weight:700}
.card .ok{background:#4caf50;color:#fff}
.card .play{background:#ff8a1f;color:#fff}
.card small{color:#7a5a3a}
.btn-import{background:#217346!important;color:#fff!important;font-size:13px!important;padding:5px 12px!important;border:3px solid #144c29!important;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center}
.btn-import:hover{background:#1e6b41!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><div class="c" id="hc">Lớp</div><div>Còn lại: <b id="hl">0</b></div><div>Vừa gọi: <b id="hv">—</b></div></div>
<div id="win" title="Bấm để đóng"><small>🎯 Mời em</small><b id="wn"></b><small>lên trả bài! 🎉</small></div>
<div id="msg"></div>
<div id="bar">
  <select id="sel" title="Chọn lớp"></select>
  <button id="bGo" class="big">🦟 Gọi tên tiếp</button>
  <button id="bNew">🔄 Chơi mới</button>
  <button id="bMng">⚙️ Quản lý lớp</button>
  <div class="grp">Muỗi bay: <span class="seg" id="sFly"></span></div>
  <div class="grp">Chờ đập: <span class="seg" id="sWait"></span></div>
  <label class="grp"><input type="checkbox" id="cNo"> Gọi không trùng lặp</label>
  <button id="bSnd" title="Bật/Tắt âm thanh">🔊 Âm thanh</button>
</div>
<div id="modal"><div class="card">
  <h2>⚙️ Quản lý lớp học</h2>
  <div class="row"><select id="mSel"></select><button id="mAdd">➕ Thêm lớp</button><button id="mDel">🗑 Xóa lớp</button></div>
  <label for="mName">Tên lớp</label><input type="text" id="mName" placeholder="Ví dụ: Lớp 10A1">
  
  <div class="row" style="justify-content:space-between; align-items:flex-end; margin-top:12px; margin-bottom:4px;">
    <label for="mList" style="margin:0;">Danh sách học sinh</label>
    <label class="btn-import" for="mExcel">📗 Nhập từ Excel (.xlsx)
      <input type="file" id="mExcel" accept=".xlsx, .xls, .csv" style="display:none;">
    </label>
  </div>
  
  <textarea id="mList" placeholder="Mỗi dòng một tên, hoặc cách nhau bằng dấu phẩy"></textarea>
  <div class="row" style="margin-top:6px"><small id="mCount"></small><small>· Thay đổi được lưu tự động trên trình duyệt này.</small></div>
  <div class="row" style="justify-content:flex-end"><button id="mSave" class="ok">💾 Lưu lớp</button><button id="mPlay" class="play">▶ Lưu &amp; chơi lớp này</button><button id="mClose">✖ Đóng</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),KEY='dapmuoi_v1';
const FLY={slow:.5,mid:1,fast:1.9},WAIT={slow:2600,mid:1300,fast:500};
const OPT=[['fast','Nhanh'],['mid','Vừa'],['slow','Chậm']];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D;
function load(){try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!D||!D.classes||!D.classes.length){const id=uid();D={active:id,fly:'mid',wait:'mid',noRep:true,sound:true,classes:[{id,name:'Lớp mẫu 10A1',students:['Nguyễn Văn A','Nguyễn Văn B','Trần Thị C','Lê Minh D','Phạm Thu E','Hoàng Gia F']}]}}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const cur=()=>D.classes.find(c=>c.id===D.active)||D.classes[0];

/* ---------- Trạng thái game ---------- */
let M=[],P=[],W=0,H=0,DPR=1,barH=120,bg,floorY,baseY,U=1,cx,tgt=null,hitPt={x:0,y:0},lastName='',zapT=-9999,flash=0;
let st={ph:'idle',t0:0};
const ease=t=>1-Math.pow(1-t,3);
function box(x,y,w,h,r,f,s){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);if(f){ctx.fillStyle=f;ctx.fill()}if(s){ctx.strokeStyle=s;ctx.stroke()}}
const bounds=()=>({x0:50,x1:Math.max(120,W-50),y0:75,y1:Math.max(170,baseY-70)});
function place(m){const b=bounds();m.x=b.x0+Math.random()*(b.x1-b.x0);m.y=b.y0+Math.random()*(b.y1-b.y0)}
function newM(n,i){const m={n,hue:(i*47)%360,state:'fly',called:false,ph:Math.random()*9,a:Math.random()*6.28,turn:0,tt:0,sp:55+Math.random()*50,al:1,vx:0,vy:0,rot:0};place(m);return m}
function resetGame(){M=cur().students.map(newM);tgt=null;st={ph:'idle',t0:0};lastName='';hideWin();hud()}
function hud(){const left=D.noRep?M.filter(m=>!m.called).length:M.length;$('hc').textContent=cur().name;$('hl').textContent=left+' / '+M.length;$('hv').textContent=lastName||'—'}
function toast(t){const e=$('msg');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
function hideWin(){$('win').style.display='none'}
function showWin(n){$('wn').textContent=n;const w=$('win');w.style.display='flex';w.classList.remove('pop');void w.offsetWidth;w.classList.add('pop')}

/* ---------- Hệ thống Âm thanh Synth ---------- */
let ac, masterGain, bgmTimer, buzzOsc, buzzGain, buzzMod;
let isAudioInit = false;

function initAudio(){
 if(isAudioInit) return;
 try{
  ac = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = ac.createGain();
  masterGain.gain.value = D.sound !== false ? 1 : 0;
  masterGain.connect(ac.destination);
  buzzOsc = ac.createOscillator(); buzzMod = ac.createOscillator();
  const modGain = ac.createGain(); buzzGain = ac.createGain();
  buzzOsc.type = 'sawtooth'; buzzOsc.frequency.value = 520;
  buzzMod.type = 'sine'; buzzMod.frequency.value = 18;
  modGain.gain.value = 40;
  buzzMod.connect(modGain).connect(buzzOsc.frequency);
  buzzGain.gain.value = 0;
  buzzOsc.connect(buzzGain).connect(masterGain);
  buzzOsc.start(); buzzMod.start();
  startBGM(); isAudioInit = true;
 }catch(e){}
}
function ensureAudio(){ if(!ac) initAudio(); else if(ac.state==='suspended') ac.resume(); }
function updateBuzzSound(){
 if(!ac || !buzzGain) return;
 const flyingCount = M.filter(m => m.state === 'fly').length;
 const targetVol = (D.sound !== false && flyingCount > 0) ? Math.min(0.015, 0.001 + flyingCount * 0.001) : 0;
 buzzGain.gain.setTargetAtTime(targetVol, ac.currentTime, 0.1);
}

const MELODY = [{n: 60, d: 0.2}, {n: 64, d: 0.2}, {n: 67, d: 0.2}, {n: 72, d: 0.4}, {n: 69, d: 0.2}, {n: 65, d: 0.2}, {n: 60, d: 0.4}, {n: 62, d: 0.2}, {n: 65, d: 0.2}, {n: 69, d: 0.2}, {n: 74, d: 0.4}, {n: 72, d: 0.2}, {n: 67, d: 0.2}, {n: 62, d: 0.4}];
function mToF(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function startBGM(){
 let stepIdx = 0;
 function playNextNote(){
  if(D.sound !== false && ac && ac.state === 'running'){
   const note = MELODY[stepIdx % MELODY.length];
   if(note.n > 0){
       const osc = ac.createOscillator(), g = ac.createGain();
       osc.type = 'square'; osc.frequency.setValueAtTime(mToF(note.n), ac.currentTime);
       g.gain.setValueAtTime(0.012, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + note.d * 0.85);
       osc.connect(g).connect(masterGain); osc.start(); osc.stop(ac.currentTime + note.d);
   }
   stepIdx++; bgmTimer = setTimeout(playNextNote, note.d * 1000);
  } else { bgmTimer = setTimeout(playNextNote, 500); }
 }
 playNextNote();
}
function tone(f1,f2,d,type,v,delay=0){
 if(D.sound === false || !ac) return;
 const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;
 o.type=type;o.frequency.setValueAtTime(f1,t);
 o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g).connect(masterGain);o.start(t);o.stop(t+d);
}
function snd(k){
 try{
  if(D.sound === false || !ac) return;
  if(k==='zap'){
   const b=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate),d=b.getChannelData(0);
   for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
   const n=ac.createBufferSource(),g=ac.createGain();
   g.gain.value=.25;n.buffer=b;n.connect(g).connect(masterGain);n.start();
   tone(900,80,.3,'sawtooth',.15);
  }
  else if(k==='whoosh') tone(300,900,.18,'sine',.12);
  else if(k==='win') [523,659,784,1047].forEach((f,i)=>tone(f,f,.25,'triangle',.18,i*.11));
 }catch(e){}
}

/* ---------- Hiệu ứng hạt ---------- */
function spark(x,y){for(let i=0;i<34;i++){const a=Math.random()*6.28,s=120+Math.random()*320;P.push({k:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6,m:.6,c:Math.random()<.5?'#fff35c':'#7fe3ff'})}
 for(let i=0;i<7;i++)P.push({k:'f',x:x+(Math.random()-.5)*20,y,vx:(Math.random()-.5)*40,vy:-30-Math.random()*50,l:1,m:1,r:10});
 P.push({k:'t',x,y:y-30,vx:0,vy:-40,l:.9,m:.9,t:'ZZZAP!'})}
function confetti(){for(let i=0;i<110;i++)P.push({k:'c',x:Math.random()*W,y:-20-Math.random()*H*.3,vx:(Math.random()-.5)*120,vy:100+Math.random()*200,l:3.5,m:3.5,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6,w:5+Math.random()*6})}

/* ---------- Logic gọi tên ---------- */
function callNext(){
 ensureAudio();
 if(st.ph!=='idle')return;
 hideWin();
 const pool=M.filter(m=>m.state==='fly'&&(!D.noRep||!m.called));
 if(!pool.length){toast(M.length?'🎉 Đã gọi hết cả lớp! Bấm "Chơi mới" để bắt đầu lại.':'Lớp chưa có học sinh. Bấm "Quản lý lớp" để thêm.');return}
 tgt=pool[Math.random()*pool.length|0];
 st={ph:'aim',t0:performance.now(),wait:Math.max(400,WAIT[D.wait]),sw:260};
}
function hit(m){
 m.state='dead';m.called=true;m.vx=(Math.random()-.5)*80;m.vy=-120;m.rot=0;m.al=1;
 lastName=m.n;spark(m.x,m.y);zapT=performance.now();flash=.5;snd('zap');
 showWin(m.n);confetti();setTimeout(()=>snd('win'),250);hud();
}
function step(now){
 if(st.ph==='aim'&&now-st.t0>=st.wait){st.ph='swing';st.t0=now;snd('whoosh')}
 else if(st.ph==='swing'&&now-st.t0>=st.sw){hitPt={x:tgt.x,y:tgt.y};hit(tgt);st.ph='back';st.t0=now}
 else if(st.ph==='back'&&now-st.t0>=550){st.ph='idle';tgt=null}
}
function upd(dt,now){
 const b=bounds();
 for(const m of M){
  if(m.state==='fly'){
   m.tt-=dt;if(m.tt<=0){m.turn=(Math.random()-.5)*3;m.tt=.4+Math.random()*1.2}
   m.a+=m.turn*dt;const s=m.sp*FLY[D.fly];
   m.x+=Math.cos(m.a)*s*dt;m.y+=Math.sin(m.a)*s*dt*.7+Math.sin(now/300+m.ph)*.3;
   const c=Math.cos(m.a),sn=Math.sin(m.a);
   if((m.x<b.x0&&c<0)||(m.x>b.x1&&c>0))m.a=Math.PI-m.a;
   if((m.y<b.y0&&sn<0)||(m.y>b.y1&&sn>0))m.a=-m.a;
  }else if(m.state==='dead'){
   m.vy+=900*dt;m.y+=m.vy*dt;m.x+=m.vx*dt;m.rot+=dt*8;m.al-=dt*1.1;
   if(m.al<=0){if(D.noRep)m.state='gone';else{m.state='fly';m.al=1;m.called=false;place(m)}}
  }
 }
 for(const p of P){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='s')p.vy+=600*dt;if(p.k==='c'){p.r+=dt*5;p.vx+=Math.sin(now/200+p.w)*2}if(p.k==='f')p.r+=25*dt}
 P=P.filter(p=>p.l>0);flash=Math.max(0,flash-dt*2.5);
 updateBuzzSound();
}

/* ---------- Vẽ nền phòng ---------- */
function buildBg(){
 bg=document.createElement('canvas');bg.width=W*DPR;bg.height=H*DPR;const g=bg.getContext('2d');g.scale(DPR,DPR);
 floorY=Math.round(Math.max(H*.45,baseY-120*U));
 for(let x=0,i=0;x<W;x+=64,i++){g.fillStyle=i%2?'#ffd451':'#ffe07a';g.fillRect(x,0,64,floorY)}
 g.fillStyle='#a8683a';g.fillRect(0,floorY-14,W,14);g.fillStyle='#8a5326';g.fillRect(0,floorY-2,W,2);
 for(let y=floorY,i=0;y<H;i++){const h=30+(y-floorY)*.1;g.fillStyle=i%2?'#c58a50':'#d49a5f';g.fillRect(0,y,W,h);g.strokeStyle='#a36d3d';g.lineWidth=2;
  g.beginPath();g.moveTo(0,y);g.lineTo(W,y);for(let x=(i%2)*70;x<W;x+=140){g.moveTo(x,y);g.lineTo(x,y+h)}g.stroke();y+=h}
 const k=Math.min(1,W/900),ww=150*k,wh=180*k,wx=Math.max(30,W*.08),wy=40;
 g.fillStyle='rgba(255,255,190,.2)';g.beginPath();g.moveTo(wx,wy+wh);g.lineTo(wx+ww,wy+wh);g.lineTo(wx+ww+280,floorY+170);g.lineTo(wx+280,floorY+170);g.fill();
 let sg=g.createLinearGradient(0,wy,0,wy+wh);sg.addColorStop(0,'#8fd3ff');sg.addColorStop(1,'#dff4ff');g.fillStyle=sg;g.fillRect(wx,wy,ww,wh);
 g.fillStyle='#ffe14d';g.beginPath();g.arc(wx+ww*.7,wy+ww*.3,22*k,0,7);g.fill();
 g.strokeStyle='#ffe14d';g.lineWidth=3;for(let i=0;i<12;i++){const a=i*Math.PI/6;g.beginPath();g.moveTo(wx+ww*.7+Math.cos(a)*28*k,wy+ww*.3+Math.sin(a)*28*k);g.lineTo(wx+ww*.7+Math.cos(a)*38*k,wy+ww*.3+Math.sin(a)*38*k);g.stroke()}
 g.strokeStyle='#8a5a2b';g.lineWidth=8;g.strokeRect(wx,wy,ww,wh);g.lineWidth=5;g.beginPath();g.moveTo(wx+ww/2,wy);g.lineTo(wx+ww/2,wy+wh);g.moveTo(wx,wy+wh/2);g.lineTo(wx+ww,wy+wh/2);g.stroke();
 g.fillStyle='#ff9fb8';g.fillRect(wx-22,wy-8,26,wh+30);g.fillRect(wx+ww-4,wy-8,26,wh+30);
 const ox=W/2,oy=80,d=new Date(),mm=d.getMinutes(),hh=d.getHours()%12+mm/60;
 g.fillStyle='#fff';g.strokeStyle='#7a4b1e';g.lineWidth=6;g.beginPath();g.arc(ox,oy,38,0,7);g.fill();g.stroke();
 g.strokeStyle='#3b2a20';g.lineWidth=3;for(let i=0;i<12;i++){const a=i*Math.PI/6;g.beginPath();g.moveTo(ox+Math.cos(a)*30,oy+Math.sin(a)*30);g.lineTo(ox+Math.cos(a)*34,oy+Math.sin(a)*34);g.stroke()}
 g.lineCap='round';g.lineWidth=5;g.beginPath();g.moveTo(ox,oy);g.lineTo(ox+Math.cos(hh*Math.PI/6-Math.PI/2)*18,oy+Math.sin(hh*Math.PI/6-Math.PI/2)*18);g.stroke();
 g.lineWidth=3;g.beginPath();g.moveTo(ox,oy);g.lineTo(ox+Math.cos(mm*Math.PI/30-Math.PI/2)*27,oy+Math.sin(mm*Math.PI/30-Math.PI/2)*27);g.stroke();
 const px=Math.min(W*.74,W-250);
 g.fillStyle='#8a5a2b';g.fillRect(px,45,120,88);g.fillStyle='#bfe8ff';g.fillRect(px+8,53,104,72);
 g.fillStyle='#4caf50';g.beginPath();g.moveTo(px+8,125);g.lineTo(px+45,80);g.lineTo(px+75,125);g.fill();g.fillStyle='#2e8b57';g.beginPath();g.moveTo(px+50,125);g.lineTo(px+85,90);g.lineTo(px+112,125);g.fill();
 g.fillStyle='#ffe14d';g.beginPath();g.arc(px+95,70,9,0,7);g.fill();
 g.fillStyle='#8a5a2b';g.fillRect(px+135,60,70,92);g.fillStyle='#ffd1dc';g.fillRect(px+142,67,56,78);g.fillStyle='#e8333f';g.beginPath();g.arc(px+170,100,16,0,7);g.fill();g.fillStyle='#ffe14d';g.beginPath();g.arc(px+170,100,6,0,7);g.fill();
 const lx=Math.min(W*.92,W-40),ly=floorY+55;
 g.fillStyle='#4caf50';for(let i=-2;i<=2;i++){g.beginPath();g.ellipse(lx+i*14,ly-50-Math.abs(i)*-6,9,32,i*.3,0,7);g.fill()}
 g.fillStyle='#c2603a';g.beginPath();g.moveTo(lx-26,ly-24);g.lineTo(lx+26,ly-24);g.lineTo(lx+18,ly+16);g.lineTo(lx-18,ly+16);g.fill();
 g.fillStyle='#7bc4e8';g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.ellipse(cx,baseY-2,150*U,24*U,0,0,7);g.fill();g.stroke();
}
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;barH=$('bar').offsetHeight;cx=W/2;baseY=H-barH-14;U=Math.max(.6,Math.min(1.05,(baseY-80)/300));buildBg()}

/* ---------- Vẽ muỗi ---------- */
function drawM(m,now){
 if(m.state==='gone')return;
 const t=now/1000,dead=m.state==='dead',sel=tgt===m&&(st.ph==='aim'||st.ph==='swing'),al=Math.max(0,m.al);
 ctx.save();ctx.globalAlpha=al;ctx.translate(m.x,m.y);
 if(sel){ctx.strokeStyle='#e8333f';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,28+Math.sin(t*12)*3,0,7);ctx.stroke()}
 if(dead)ctx.rotate(m.rot);
 const s=sel?1.2:1,fl=dead?0:Math.sin(t*45+m.ph);
 ctx.scale((Math.cos(m.a)<0?-1:1)*s,s);
 ctx.fillStyle='rgba(205,236,255,.8)';ctx.strokeStyle='#6a8aa6';ctx.lineWidth=1;
 for(const r of[-.9+.3*fl,-.3-.3*fl]){ctx.save();ctx.translate(3,-4);ctx.rotate(r);ctx.beginPath();ctx.ellipse(0,-11,5,12,0,0,7);ctx.fill();ctx.stroke();ctx.restore()}
 ctx.strokeStyle='#222';ctx.lineWidth=1.5;ctx.beginPath();[[-2,5,-8,15],[3,5,3,16],[7,4,13,14]].forEach(l=>{ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3])});ctx.moveTo(17,0);ctx.lineTo(28,4);ctx.stroke();
 ctx.fillStyle=`hsl(${m.hue},40%,34%)`;ctx.beginPath();ctx.ellipse(-10,2,15,6.5,0,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(-14,-4,2.5,13);ctx.fillRect(-7,-4,2.5,13);
 ctx.fillStyle='#333';ctx.beginPath();ctx.arc(5,0,6.5,0,7);ctx.fill();ctx.fillStyle='#444';ctx.beginPath();ctx.arc(13,-1,5,0,7);ctx.fill();
 ctx.fillStyle='#ff3b3b';ctx.beginPath();ctx.arc(15,-2,1.8,0,7);ctx.fill();
 ctx.restore();
 ctx.save();ctx.globalAlpha=al;ctx.font='bold 13px "Segoe UI",Arial,sans-serif';ctx.textAlign='center';
 const w=ctx.measureText(m.n).width+16,lx=m.x-w/2,ly=m.y-(dead?60:46);
 ctx.lineWidth=2;box(lx,ly,w,22,8,sel?'#e8333f':'rgba(255,255,255,.95)','#7a4b1e');
 ctx.fillStyle=sel?'#fff':'#3b2a20';ctx.fillText(m.n,m.x,ly+16);ctx.restore();
}

/* ---------- Vẽ nhân vật + vợt ---------- */
const toL=(x,y)=>({x:(x-cx)/U,y:(y-baseY)/U});
function drawChar(now){
 const t=now/1000,S={x:34,y:-140},P0={x:105,y:-235+Math.sin(t*3)*4},e=now-st.t0;
 let T=null,pr=0;
 if(st.ph==='aim'){T=toL(tgt.x,tgt.y);pr=.28*ease(Math.min(1,e/300))+Math.sin(t*14)*.01}
 else if(st.ph==='swing'){T=toL(tgt.x,tgt.y);pr=.28+.72*Math.pow(Math.min(1,e/st.sw),2)}
 else if(st.ph==='back'){T=toL(hitPt.x,hitPt.y);pr=1-ease(Math.min(1,e/550))}
 const Q=T?{x:P0.x+(T.x-P0.x)*pr,y:P0.y+(T.y-P0.y)*pr}:P0;
 ctx.save();ctx.translate(cx,baseY);ctx.scale(U,U);ctx.lineCap='round';
 ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,2,58,10,0,0,7);ctx.fill();
 box(-26,-72,20,72,6,'#34508c');box(6,-72,20,72,6,'#34508c');
 ctx.fillStyle='#3b2a20';ctx.beginPath();ctx.ellipse(-16,0,17,8,0,0,7);ctx.ellipse(16,0,17,8,0,0,7);ctx.fill();
 box(-37,-152,74,88,20,'#e8533f');box(-37,-118,74,9,0,'#fff');
 ctx.strokeStyle='#e8533f';ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(-34,-140);ctx.lineTo(-48,-92);ctx.stroke();
 ctx.fillStyle='#ffd3a8';ctx.beginPath();ctx.arc(-49,-86,9,0,7);ctx.arc(-37,-184,7,0,7);ctx.arc(37,-184,7,0,7);ctx.arc(0,-188,37,0,7);ctx.fill();
 ctx.fillStyle='#2f2118';ctx.beginPath();ctx.arc(0,-190,39,Math.PI,0);ctx.fill();
 let lx=Math.sin(t)*1.5,ly=0;if(T){const dx=T.x,dy=T.y+188,d=Math.hypot(dx,dy)||1;lx=dx/d*3.5;ly=dy/d*3.5}
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-14,-186,8.5,0,7);ctx.arc(14,-186,8.5,0,7);ctx.fill();
 ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-14+lx,-186+ly,4.5,0,7);ctx.arc(14+lx,-186+ly,4.5,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,120,120,.45)';ctx.beginPath();ctx.arc(-25,-172,6,0,7);ctx.arc(25,-172,6,0,7);ctx.fill();
 ctx.strokeStyle='#7a2e2e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-178,11,.15*Math.PI,.85*Math.PI);ctx.stroke();
 const a=Math.atan2(Q.y-S.y,Q.x-S.x),Lh=34,ry=34,rx=28,gx=Q.x-Math.cos(a)*(Lh+ry),gy=Q.y-Math.sin(a)*(Lh+ry);
 ctx.strokeStyle='#e8533f';ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(S.x,S.y);ctx.lineTo(gx,gy);ctx.stroke();
 ctx.save();ctx.translate(gx,gy);ctx.rotate(a);
 box(-4,-4,Lh+6,8,3,'#d9432f');
 ctx.beginPath();ctx.ellipse(Lh+ry,0,ry,rx,0,0,7);ctx.fillStyle='rgba(215,245,255,.65)';ctx.fill();
 ctx.save();ctx.clip();ctx.strokeStyle='rgba(70,110,140,.55)';ctx.lineWidth=1;ctx.beginPath();
 for(let k=-32;k<=32;k+=8){ctx.moveTo(Lh+ry+k,-rx);ctx.lineTo(Lh+ry+k,rx);ctx.moveTo(Lh,k);ctx.lineTo(Lh+2*ry,k)}ctx.stroke();ctx.restore();
 ctx.strokeStyle='#2b2b2b';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(Lh+ry,0,ry,rx,0,0,7);ctx.stroke();
 if(st.ph==='aim'||st.ph==='swing'||now-zapT<400){ctx.strokeStyle=`rgba(255,235,60,${.4+Math.random()*.6})`;ctx.lineWidth=2.5;ctx.shadowColor='#ffe14d';ctx.shadowBlur=14;ctx.beginPath();ctx.ellipse(Lh+ry,0,ry-6,rx-6,0,0,7);ctx.stroke()}
 ctx.restore();
 ctx.fillStyle='#ffd3a8';ctx.beginPath();ctx.arc(gx,gy,10,0,7);ctx.fill();
 ctx.restore();
}

function draw(now){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.drawImage(bg,0,0,W,H);
 for(const m of M)drawM(m,now);
 drawChar(now);
 if(now-zapT<250){ctx.strokeStyle='#fff35c';ctx.lineWidth=3;ctx.shadowColor='#7fe3ff';ctx.shadowBlur=12;
  for(let i=0;i<7;i++){let x=hitPt.x,y=hitPt.y,a=Math.random()*6.28;ctx.beginPath();ctx.moveTo(x,y);for(let j=0;j<3;j++){a+=(Math.random()-.5)*1.6;x+=Math.cos(a)*16;y+=Math.sin(a)*16;ctx.lineTo(x,y)}ctx.stroke()}ctx.shadowBlur=0}
 for(const p of P){ctx.globalAlpha=Math.max(0,p.l/p.m);
  if(p.k==='s'){ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)}
  else if(p.k==='f'){ctx.fillStyle='rgba(120,120,120,.6)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
  else if(p.k==='c'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-3,p.w,6);ctx.restore()}
  else{ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.fillStyle='#ffe14d';ctx.strokeStyle='#c0392b';ctx.lineWidth=4;ctx.strokeText(p.t,p.x,p.y);ctx.fillText(p.t,p.x,p.y)}}
 ctx.globalAlpha=1;
 if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H)}
}
let lt=performance.now();
function loop(now){const dt=Math.min(.05,(now-lt)/1000);lt=now;step(now);upd(dt,now);draw(now);requestAnimationFrame(loop)}

/* ---------- Điều khiển ---------- */
function updateSndBtn(){ $('bSnd').textContent = D.sound !== false ? '🔊 Âm thanh' : '🔇 Tắt âm'; }
function refreshSel(){const o=D.classes.map(c=>`<option value="${c.id}"${c.id===D.active?' selected':''}>${esc(c.name)} (${c.students.length})</option>`).join('');$('sel').innerHTML=o}
function seg(id,key){const el=$(id);el.innerHTML='';OPT.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.className=D[key]===v?'on':'';b.onclick=()=>{D[key]=v;save();seg(id,key)};el.appendChild(b)})}
$('sel').onchange=e=>{D.active=e.target.value;save();resetGame()};
$('bGo').onclick=callNext;
$('bNew').onclick=()=>{resetGame();toast('Đã làm mới danh sách muỗi!')};
$('win').onclick=hideWin;
$('cNo').onchange=e=>{D.noRep=e.target.checked;if(!D.noRep)M.forEach(m=>{if(m.state==='gone'){m.state='fly';m.al=1;place(m)}m.called=false});save();hud()};
$('bSnd').onclick=()=>{ ensureAudio(); D.sound = !(D.sound !== false); if(masterGain) masterGain.gain.value = D.sound ? 1 : 0; updateSndBtn(); save(); };

addEventListener('keydown',e=>{if(e.code==='Space'&&$('modal').style.display!=='flex'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();callNext()}});
addEventListener('pointerdown', ensureAudio, {once: true});

/* ---------- Quản lý lớp & Nhập Excel ---------- */
let ed;
const parse=s=>s.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);
const cnt=()=>$('mCount').textContent='Số học sinh: '+parse($('mList').value).length;
function fillM(){const c=D.classes.find(x=>x.id===ed);$('mSel').innerHTML=D.classes.map(x=>`<option value="${x.id}"${x.id===ed?' selected':''}>${esc(x.name)}</option>`).join('');$('mName').value=c.name;$('mList').value=c.students.join('\n');cnt()}
function saveForm(){const c=D.classes.find(x=>x.id===ed);if(!c)return;const n=$('mName').value.trim()||'Lớp chưa đặt tên',s=parse($('mList').value),ch=n!==c.name||s.join('|')!==c.students.join('|');
 c.name=n;c.students=s;save();refreshSel();if(ch&&ed===D.active)resetGame()}

$('bMng').onclick=()=>{ed=D.active;fillM();$('modal').style.display='flex'};
$('mList').oninput=cnt;
$('mSel').onchange=e=>{saveForm();ed=e.target.value;fillM()};
$('mAdd').onclick=()=>{saveForm();const c={id:uid(),name:'Lớp mới',students:[]};D.classes.push(c);ed=c.id;save();refreshSel();fillM();$('mName').select()};
$('mDel').onclick=()=>{const c=D.classes.find(x=>x.id===ed);if(!confirm('Xóa lớp "'+c.name+'"?'))return;
 D.classes=D.classes.filter(x=>x.id!==ed);if(!D.classes.length)D.classes.push({id:uid(),name:'Lớp mới',students:[]});
 ed=D.classes[0].id;if(!D.classes.some(x=>x.id===D.active)){D.active=ed;resetGame()}save();refreshSel();fillM()};
$('mSave').onclick=()=>{saveForm();fillM();toast('Đã lưu lớp ✔')};
$('mPlay').onclick=()=>{saveForm();if(D.active!==ed){D.active=ed;save();refreshSel();resetGame()}$('modal').style.display='none'};
$('mClose').onclick=()=>{saveForm();$('modal').style.display='none'};

// Xử lý đọc file Excel
$('mExcel').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  if (typeof XLSX === 'undefined') {
      toast('Lỗi: Cần có mạng để tải thư viện đọc Excel ở lần mở đầu tiên.');
      this.value = ''; return;
  }

  const reader = new FileReader();
  reader.onload = function(evt) {
      try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, {type: 'array'});
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
          
          let names = [];
          rows.forEach(row => {
              let cells = row.filter(c => c !== undefined && c !== null && String(c).trim() !== '');
              if (cells.length === 0) return;
              
              let nameParts = [];
              for(let c of cells) {
                  let s = String(c).trim();
                  if (/^\d+$/.test(s)) continue; // Bỏ qua số thứ tự
                  if (/^(stt|họ tên|họ và tên|tên|ngày sinh|ghi chú|giới tính|nam|nữ|lớp|trường)$/i.test(s)) return; // Bỏ qua dòng tiêu đề
                  if (s.length >= 2 && !/^\d{1,2}\/\d{1,2}/.test(s)) nameParts.push(s); // Lấy văn bản, bỏ qua định dạng ngày tháng
              }
              if (nameParts.length > 0) {
                  let bestName = nameParts.sort((a,b) => b.length - a.length)[0]; // Chọn chuỗi văn bản dài nhất (thường là họ tên đầy đủ)
                  if(bestName) names.push(bestName);
              }
          });
          
          if (names.length > 0) {
              const currentVal = $('mList').value.trim();
              $('mList').value = currentVal ? currentVal + '\n' + names.join('\n') : names.join('\n');
              cnt(); saveForm();
              toast(`Đã nhập thành công ${names.length} học sinh từ Excel!`);
          } else {
              toast('Không tìm thấy dữ liệu tên học sinh hợp lệ trong file.');
          }
      } catch(err) {
          toast('Lỗi đọc file Excel! Hãy kiểm tra lại file.');
          console.error(err);
      }
      $('mExcel').value = ''; // Reset input
  };
  reader.readAsArrayBuffer(file);
});

/* ---------- Khởi động ---------- */
load();refreshSel();seg('sFly','fly');seg('sWait','wait');$('cNo').checked=D.noRep;updateSndBtn();
resize();resetGame();
addEventListener('resize',()=>{resize();M.forEach(m=>{const b=bounds();m.x=Math.min(Math.max(m.x,b.x0),b.x1);m.y=Math.min(Math.max(m.y,b.y0),b.y1)})});
if(window.ResizeObserver)new ResizeObserver(()=>{if($('bar').offsetHeight!==barH)resize()}).observe($('bar'));
setInterval(buildBg,60000);
requestAnimationFrame(loop);
</script>
